name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[ntlm,http2,socks]' ruff==0.17.2
      - run: python -m compileall -q fuzzhttpbypass.py
      - run: ruff check fuzzhttpbypass.py tests
      - run: python -m unittest discover -s tests -v
